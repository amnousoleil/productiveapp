<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>🔍 Mail Module - Diagnostic</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            line-height: 1.6;
        }
        .test {
            margin: 10px 0;
            padding: 10px;
            border-left: 4px solid #666;
        }
        .test.pass {
            border-color: #0f0;
            background: rgba(0, 255, 0, 0.1);
        }
        .test.fail {
            border-color: #f00;
            background: rgba(255, 0, 0, 0.1);
        }
        .test.warn {
            border-color: #ff0;
            background: rgba(255, 255, 0, 0.1);
        }
        h1 { color: #d4af37; }
        h2 { color: #888; font-size: 16px; margin-top: 30px; }
        code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 3px; }
        button {
            background: #d4af37;
            border: none;
            padding: 10px 20px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 5px;
            border-radius: 4px;
        }
        button:hover { background: #f4d03f; }
        #console {
            background: #000;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #333;
            max-height: 300px;
            overflow-y: auto;
        }
        .log { color: #0f0; }
        .error { color: #f00; }
        .warn { color: #ff0; }
    </style>
</head>
<body>
    <h1>🔍 Diagnostic Module Mail</h1>
    <p>Cette page teste tous les composants du module Mail</p>

    <button onclick="runAllTests()">▶️ Lancer tous les tests</button>
    <button onclick="testNavigate()">🧪 Tester navigation Mail</button>
    <button onclick="location.reload()">🔄 Recharger</button>

    <div id="results"></div>
    <div id="console"></div>

    <!-- Charger tous les modules nécessaires -->
    <script src="js/modules/services/api-config.js?v=1700"></script>
    <script src="js/modules/services/api-tokens.js?v=1700"></script>
    <script src="js/modules/services/api-fetch.js?v=1700"></script>
    <script src="js/modules/services/api.js?v=1700"></script>
    <script src="js/modules/sidebar/sidebar-core.js?v=2300"></script>
    <script src="js/modules/router.js?v=1700"></script>
    <script src="js/modules/mail/mail-api.js?v=2400"></script>
    <script src="js/modules/mail/mail-view.js?v=200"></script>

    <script>
        const results = document.getElementById('results');
        const consoleDiv = document.getElementById('console');
        let testsPassed = 0;
        let testsFailed = 0;

        function log(msg, type = 'log') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            consoleDiv.appendChild(div);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function test(name, condition, details = '') {
            const div = document.createElement('div');
            div.className = 'test';

            if (condition === 'warn') {
                div.classList.add('warn');
                div.innerHTML = `⚠️ ${name}<br><small>${details}</small>`;
            } else if (condition) {
                div.classList.add('pass');
                div.innerHTML = `✅ ${name}<br><small>${details}</small>`;
                testsPassed++;
            } else {
                div.classList.add('fail');
                div.innerHTML = `❌ ${name}<br><small>${details}</small>`;
                testsFailed++;
                log(`FAIL: ${name} - ${details}`, 'error');
            }

            results.appendChild(div);
        }

        function runAllTests() {
            results.innerHTML = '';
            consoleDiv.innerHTML = '<h2>📋 Console Logs</h2>';
            testsPassed = 0;
            testsFailed = 0;

            log('Démarrage des tests...');

            // Test 1: Modules API
            test('Module ApiConfig existe', typeof ApiConfig !== 'undefined', `typeof = ${typeof ApiConfig}`);
            test('Module ApiTokens existe', typeof ApiTokens !== 'undefined', `typeof = ${typeof ApiTokens}`);
            test('Module ApiFetch existe', typeof ApiFetch !== 'undefined', `typeof = ${typeof ApiFetch}`);
            test('Module Api existe', typeof Api !== 'undefined', `typeof = ${typeof Api}`);

            // Test 2: Api methods
            if (typeof Api !== 'undefined') {
                test('Api.get existe', typeof Api.get === 'function', 'Méthode GET disponible');
                test('Api.post existe', typeof Api.post === 'function', 'Méthode POST disponible');
                test('Api.put existe', typeof Api.put === 'function', 'Méthode PUT disponible');
                test('Api.delete existe', typeof Api.delete === 'function', 'Méthode DELETE disponible');
            }

            // Test 3: MailAPI
            test('Module MailAPI existe', typeof MailAPI !== 'undefined', `typeof = ${typeof MailAPI}`);
            if (typeof MailAPI !== 'undefined') {
                test('MailAPI.send existe', typeof MailAPI.send === 'function', 'Méthode send disponible');
                test('MailAPI.getTemplates existe', typeof MailAPI.getTemplates === 'function', 'Méthode getTemplates disponible');
                test('MailAPI.checkConfig existe', typeof MailAPI.checkConfig === 'function', 'Méthode checkConfig disponible');
                test('MailAPI.getStats existe', typeof MailAPI.getStats === 'function', 'Méthode getStats disponible');

                // Vérifier qu'il n'utilise pas ApiConfig.getHeaders (l'ancienne méthode)
                const mailApiSource = MailAPI.toString();
                const usesOldMethod = mailApiSource.includes('ApiConfig.getHeaders');
                test('MailAPI n\'utilise PAS ApiConfig.getHeaders', !usesOldMethod,
                    usesOldMethod ? '⚠️ ERREUR: Utilise encore l\'ancienne méthode' : 'Utilise Api.post/get/put/delete');
            }

            // Test 4: MailView
            test('Module MailView existe', typeof MailView !== 'undefined', `typeof = ${typeof MailView}`);
            if (typeof MailView !== 'undefined') {
                test('MailView.init existe', typeof MailView.init === 'function', 'Méthode init disponible');
                test('MailView.render existe', typeof MailView.render === 'function', 'Méthode render disponible');
            }

            // Test 5: Sidebar
            test('Module Sidebar existe', typeof Sidebar !== 'undefined', `typeof = ${typeof Sidebar}`);
            if (typeof Sidebar !== 'undefined') {
                test('Sidebar.navigate existe', typeof Sidebar.navigate === 'function', 'Méthode navigate disponible');
            }

            // Test 6: Router
            test('Module ViewRouter existe', typeof ViewRouter !== 'undefined', `typeof = ${typeof ViewRouter}`);
            if (typeof ViewRouter !== 'undefined') {
                test('ViewRouter.navigate existe', typeof ViewRouter.navigate === 'function', 'Méthode navigate disponible');

                // Vérifier que 'mail' est dans les vues
                const hasMailView = ViewRouter.VIEWS && ViewRouter.VIEWS.mail === 'view-mail';
                test('ViewRouter a la vue "mail"', hasMailView,
                    hasMailView ? 'mail → view-mail' : '⚠️ Vue mail non trouvée');
            }

            // Test 7: DOM
            const mailContainer = document.getElementById('view-mail');
            test('Container #view-mail existe dans DOM', 'warn',
                'Cette page de test n\'a pas le container, mais index.html doit l\'avoir');

            // Résumé
            setTimeout(() => {
                results.innerHTML += `<h2 style="margin-top: 30px;">📊 Résumé</h2>
                    <div class="test ${testsFailed === 0 ? 'pass' : 'fail'}">
                        ✅ Tests réussis: ${testsPassed}<br>
                        ❌ Tests échoués: ${testsFailed}<br>
                        ${testsFailed === 0 ? '<strong>🎉 Tous les modules sont OK !</strong>' : '<strong>⚠️ Certains modules ont des problèmes</strong>'}
                    </div>`;

                log(`Tests terminés: ${testsPassed} réussis, ${testsFailed} échoués`);
            }, 100);
        }

        function testNavigate() {
            log('🧪 Test de navigation vers Mail...', 'warn');

            if (typeof Sidebar === 'undefined') {
                log('❌ Sidebar non défini', 'error');
                alert('❌ Sidebar non défini - recharger la page');
                return;
            }

            if (typeof Sidebar.navigate !== 'function') {
                log('❌ Sidebar.navigate n\'est pas une fonction', 'error');
                alert('❌ Sidebar.navigate n\'est pas une fonction');
                return;
            }

            try {
                log('Appel Sidebar.navigate("mail")...');
                Sidebar.navigate('mail');
                log('✅ Navigation appelée sans erreur', 'log');
                alert('✅ Navigation appelée ! Vérifiez si MailView.init() a été appelé dans la console.');
            } catch (error) {
                log(`❌ Erreur: ${error.message}`, 'error');
                alert(`❌ Erreur: ${error.message}`);
            }
        }

        // Intercepter les logs console
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        console.log = function(...args) {
            log(args.join(' '), 'log');
            originalLog.apply(console, args);
        };

        console.error = function(...args) {
            log(args.join(' '), 'error');
            originalError.apply(console, args);
        };

        console.warn = function(...args) {
            log(args.join(' '), 'warn');
            originalWarn.apply(console, args);
        };

        // Auto-run au chargement
        window.addEventListener('load', () => {
            setTimeout(runAllTests, 500);
        });
    </script>
</body>
</html>
