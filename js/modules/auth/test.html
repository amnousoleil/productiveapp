<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthLogin Test - ProductiveApp</title>

    <!-- CSS du login -->
    <link rel="stylesheet" href="login.css">

    <style>
        /* Styles minimaux pour le test */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
        }

        /* Simuler les vues de l'app */
        .view-container { display: none; padding: 40px; }
        .view-container.active { display: block; }

        #view-tasks {
            background: linear-gradient(135deg, #1a1a2e, #2d2117);
            min-height: 100vh;
        }

        .test-header {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-bottom: 1px solid rgba(255,200,100,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-title {
            color: #d4af37;
            font-size: 1.5rem;
        }

        .test-user {
            color: rgba(255,255,255,0.8);
        }

        .test-buttons {
            display: flex;
            gap: 10px;
        }

        .test-btn {
            padding: 10px 20px;
            border: 1px solid rgba(255,200,100,0.3);
            background: rgba(0,0,0,0.3);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .test-btn:hover {
            background: rgba(255,200,100,0.1);
            border-color: rgba(255,200,100,0.5);
        }

        .test-content {
            padding: 40px;
            text-align: center;
        }

        .test-success {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .test-message {
            color: rgba(255,255,255,0.7);
            font-size: 1.2rem;
        }

        /* Console de debug */
        #debug-console {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid rgba(255, 200, 100, 0.3);
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            z-index: 100000;
        }

        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .log-info { color: #4fc3f7; }
        .log-success { color: #81c784; }
        .log-warn { color: #ffb74d; }
        .log-error { color: #e57373; }
    </style>
</head>
<body>
    <!-- Vue simulée de l'app (s'affiche après login) -->
    <div id="view-tasks" class="view-container">
        <div class="test-header">
            <div class="test-title">ProductiveApp - TEST MODE</div>
            <div class="test-user" id="test-current-user">Non connecté</div>
            <div class="test-buttons">
                <button class="test-btn" onclick="AuthLogin.switchMember()">Changer de membre</button>
                <button class="test-btn" onclick="AuthLogin.logout()">Déconnexion</button>
            </div>
        </div>
        <div class="test-content">
            <div class="test-success">✅</div>
            <div class="test-message">LOGIN RÉUSSI ! L'app fonctionne.</div>
            <p style="margin-top: 20px; color: rgba(255,255,255,0.5);">
                Ouvre la console (F12) pour voir les logs détaillés.
            </p>
        </div>
    </div>

    <!-- Console de debug -->
    <div id="debug-console">
        <strong style="color: #d4af37;">Debug Console</strong>
        <div id="debug-logs"></div>
    </div>

    <!-- Dépendances (ordre important) -->
    <script src="../../api/api-config.js"></script>
    <script src="../../api/api-tokens.js"></script>
    <script src="../../api/api-fetch.js"></script>
    <script src="../../api/api.js"></script>
    <script src="../../api/api-auth.js"></script>
    <script src="../config.js"></script>
    <script src="../state.js"></script>

    <!-- Module de login -->
    <script src="login.js"></script>

    <!-- Script de test -->
    <script>
        // Intercepter console.log pour afficher dans la debug console
        const debugLogs = document.getElementById('debug-logs');
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;

        function addLog(type, args) {
            const entry = document.createElement('div');
            entry.className = 'log-entry log-' + type;
            entry.textContent = Array.from(args).map(a =>
                typeof a === 'object' ? JSON.stringify(a) : String(a)
            ).join(' ');
            debugLogs.appendChild(entry);
            debugLogs.scrollTop = debugLogs.scrollHeight;
        }

        console.log = function(...args) {
            originalLog.apply(console, args);
            addLog(args[0]?.includes?.('✅') ? 'success' : 'info', args);
        };

        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addLog('warn', args);
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            addLog('error', args);
        };

        // Simuler App.init() - c'est ce que fait l'app réelle
        const App = {
            VERSION: 'TEST-1.0',

            async init() {
                console.log('🚀 App.init() called - VERSION:', this.VERSION);

                // IMPORTANT: Vérifier si déjà authentifié pour éviter la boucle
                if (typeof AuthLogin !== 'undefined' && AuthLogin.authenticated) {
                    console.log('✅ App.init: AuthLogin.authenticated=true, continuing...');
                } else {
                    console.log('⚠️ App.init: Not authenticated yet');
                }

                // Simuler l'initialisation de l'app
                console.log('✅ App.init: Initializing components...');

                // Mettre à jour l'affichage de l'utilisateur
                const userEl = document.getElementById('test-current-user');
                if (userEl && AppState.currentUser) {
                    userEl.textContent = 'Connecté: ' + AppState.currentUser.name;
                }

                console.log('✅ App.init: COMPLETE');
            }
        };

        // Exposer App globalement
        window.App = App;

        // Lancer le login au chargement
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 Page loaded, starting AuthLogin...');
            AuthLogin.init();
        });
    </script>
</body>
</html>
