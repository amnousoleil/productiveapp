<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link rel="stylesheet" href="notes.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Notes</h1>
                <button id="new-note" class="btn-new" title="Nouvelle note">+</button>
            </div>
            <div class="search-box">
                <input type="text" id="search" placeholder="Rechercher...">
            </div>
            <ul id="notes-list" class="notes-list"></ul>
        </aside>

        <main class="editor-container">
            <div id="empty-state" class="empty-state">
                <p>Sélectionnez une note ou créez-en une nouvelle</p>
            </div>
            <div id="editor-wrapper" class="editor-wrapper hidden">
                <input type="text" id="note-title" class="note-title" placeholder="Titre de la note">
                <div class="editor-tabs">
                    <button class="tab active" data-mode="edit">Éditer</button>
                    <button class="tab" data-mode="preview">Aperçu</button>
                </div>
                <textarea id="note-content" class="note-content" placeholder="Écrivez en Markdown..."></textarea>
                <div id="preview" class="preview hidden"></div>
                <div class="editor-footer">
                    <span id="note-date" class="note-date"></span>
                    <button id="delete-note" class="btn-delete">Supprimer</button>
                </div>
            </div>
        </main>
    </div>
    <script src="notes.js"></script>
</body>
</html>
