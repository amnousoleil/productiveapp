<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gyro-grad-normal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <filter id="glow-normal">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Base -->
  <rect x="10" y="24" width="12" height="6" rx="2" fill="#92400E"/>
  <!-- Corps -->
  <path d="M 12 10 L 12 24 L 20 24 L 20 10 Q 20 6 16 6 Q 12 6 12 10 Z" fill="url(#gyro-grad-normal)" filter="url(#glow-normal)"/>
  <!-- Dôme -->
  <ellipse cx="16" cy="10" rx="6" ry="4" fill="#F59E0B" opacity="0.7"/>
  <ellipse cx="16" cy="10" rx="4" ry="2.5" fill="#FCD34D" opacity="0.8"/>
  <!-- Éclat -->
  <circle cx="16" cy="10" r="1.5" fill="#FEF3C7"/>
</svg>
