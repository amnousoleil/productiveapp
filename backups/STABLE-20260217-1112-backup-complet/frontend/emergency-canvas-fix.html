<!DOCTYPE html>
<html>
<head>
    <title>Emergency Canvas Fix</title>
    <style>
        body {
            font-family: monospace;
            padding: 40px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .status {
            padding: 20px;
            margin: 10px 0;
            border: 2px solid #00ff00;
            border-radius: 8px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #00cc00;
        }
    </style>
</head>
<body>
    <h1>🚨 Emergency Canvas Fix</h1>

    <div class="status" id="status">
        <h2>Status: Analyzing...</h2>
        <div id="info"></div>
    </div>

    <button onclick="fixCanvas()">🔧 Fix Canvas Opacity (0%)</button>
    <button onclick="disableAnimations()">⛔ Disable Animations Completely</button>
    <button onclick="cleanEverything()">🧹 Clean EVERYTHING + Reload</button>
    <button onclick="window.location.href='/'">🏠 Return to App</button>

    <script>
        function analyze() {
            const canvas = document.getElementById('matrix-bg');
            const info = document.getElementById('info');

            let report = '<h3>Diagnostic:</h3><ul>';

            // Canvas exists?
            if (canvas) {
                report += '<li>✅ Canvas exists</li>';
                report += '<li>Opacity: ' + getComputedStyle(canvas).opacity + '</li>';
                report += '<li>Display: ' + getComputedStyle(canvas).display + '</li>';
                report += '<li>Z-index: ' + getComputedStyle(canvas).zIndex + '</li>';
                report += '<li>Position: ' + getComputedStyle(canvas).position + '</li>';
            } else {
                report += '<li>❌ Canvas NOT found</li>';
            }

            // Check localStorage
            const intensity = localStorage.getItem('productiveapp_animation_intensity');
            const preset = localStorage.getItem('productiveapp_animation_preset');
            report += '<li>Stored Intensity: ' + (intensity || 'none') + '</li>';
            report += '<li>Stored Preset: ' + (preset || 'none') + '</li>';

            // Check SW
            navigator.serviceWorker.getRegistrations().then(regs => {
                report += '<li>Service Workers: ' + regs.length + '</li>';
                regs.forEach(reg => {
                    report += '<li style="margin-left: 20px;">→ ' + reg.scope + '</li>';
                });
                report += '</ul>';
                info.innerHTML = report;
            });
        }

        function fixCanvas() {
            const canvas = document.getElementById('matrix-bg');
            if (canvas) {
                canvas.style.opacity = '0';
                canvas.style.display = 'none';
                alert('✅ Canvas hidden! Reload the page.');
            } else {
                // Go to main app and fix it there
                localStorage.setItem('FORCE_CANVAS_OPACITY', '0');
                alert('⚠️ Canvas not found here. Setting flag for main app. Click "Return to App"');
            }
        }

        function disableAnimations() {
            localStorage.setItem('productiveapp_animation_intensity', '0');
            localStorage.setItem('productiveapp_animation_preset', 'zen');
            localStorage.setItem('DISABLE_ANIMATIONS', 'true');
            alert('✅ Animations disabled in localStorage. Return to app and reload.');
        }

        async function cleanEverything() {
            console.log('🧹 Cleaning EVERYTHING...');

            // Unregister ALL service workers
            const regs = await navigator.serviceWorker.getRegistrations();
            for (let reg of regs) {
                await reg.unregister();
                console.log('🗑️ SW unregistered:', reg.scope);
            }

            // Delete ALL caches
            const cacheNames = await caches.keys();
            for (let cacheName of cacheNames) {
                await caches.delete(cacheName);
                console.log('🗑️ Cache deleted:', cacheName);
            }

            // Clear critical localStorage
            localStorage.removeItem('sw_cleanup_done');
            localStorage.setItem('FORCE_CANVAS_OPACITY', '0');
            localStorage.setItem('DISABLE_ANIMATIONS', 'true');
            localStorage.setItem('productiveapp_animation_intensity', '0');

            alert('✅ Everything cleaned! Reloading in 2 seconds...');
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        }

        // Auto-analyze on load
        setTimeout(analyze, 500);
    </script>
</body>
</html>
