<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nettoyage Service Worker - ProductiveApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .status {
            background: #f0f0f0;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log {
            margin: 5px 0;
        }
        .log.success { color: #059669; }
        .log.error { color: #dc2626; }
        .log.info { color: #2563eb; }
        .log.warn { color: #d97706; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Nettoyage Service Worker</h1>
        <p>Cette page va nettoyer complètement tous les Service Workers et caches pour résoudre le problème d'écran noir.</p>

        <div class="status" id="status"></div>

        <button id="cleanBtn" onclick="cleanEverything()">🚀 Nettoyer et Ouvrir l'Application</button>
        <button id="manualBtn" onclick="window.location.href='/'" style="margin-top: 10px;">🏠 Aller à l'Application Maintenant</button>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const cleanBtn = document.getElementById('cleanBtn');

        function log(message, type = 'info') {
            const line = document.createElement('div');
            line.className = `log ${type}`;
            line.textContent = message;
            statusDiv.appendChild(line);
            statusDiv.scrollTop = statusDiv.scrollHeight;
            console.log(message);
        }

        async function cleanEverything() {
            cleanBtn.disabled = true;
            statusDiv.innerHTML = '';

            log('🔥 Démarrage du nettoyage complet...', 'info');

            try {
                // 1. Unregister ALL Service Workers
                if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    log(`📋 Trouvé ${regs.length} Service Worker(s)`, 'info');

                    for (let reg of regs) {
                        try {
                            await reg.unregister();
                            log(`✅ SW désenregistré: ${reg.scope}`, 'success');
                        } catch (e) {
                            log(`❌ Erreur SW: ${e.message}`, 'error');
                        }
                    }
                } else {
                    log('ℹ️ Service Workers non supportés', 'warn');
                }

                // 2. Delete ALL Caches
                const cacheNames = await caches.keys();
                log(`📋 Trouvé ${cacheNames.length} cache(s)`, 'info');

                for (let cacheName of cacheNames) {
                    try {
                        await caches.delete(cacheName);
                        log(`✅ Cache supprimé: ${cacheName}`, 'success');
                    } catch (e) {
                        log(`❌ Erreur cache: ${e.message}`, 'error');
                    }
                }

                // 3. Clear localStorage (SW flags)
                try {
                    localStorage.removeItem('sw_cleanup_done');
                    localStorage.removeItem('sw_cleaned');
                    log('✅ localStorage nettoyé', 'success');
                } catch (e) {
                    log(`⚠️ localStorage: ${e.message}`, 'warn');
                }

                // 4. Clear sessionStorage
                try {
                    sessionStorage.clear();
                    log('✅ sessionStorage nettoyé', 'success');
                } catch (e) {
                    log(`⚠️ sessionStorage: ${e.message}`, 'warn');
                }

                log('', 'info');
                log('🎉 NETTOYAGE TERMINÉ !', 'success');
                log('', 'info');
                log('Redirection dans 3 secondes...', 'info');

                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);

            } catch (error) {
                log(`❌ ERREUR GLOBALE: ${error.message}`, 'error');
                cleanBtn.disabled = false;
            }
        }

        // Auto-clean on load if query param present
        if (window.location.search.includes('auto=1')) {
            log('🤖 Nettoyage automatique...', 'info');
            setTimeout(cleanEverything, 500);
        } else {
            log('✅ Page prête. Cliquez sur le bouton pour nettoyer.', 'info');
        }
    </script>
</body>
</html>
