<!DOCTYPE html>
<html lang="fr" data-theme="executive">
<head>
    <meta charset="UTF-8">
    <title>Test Force Animations</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
        }
        html {
            background: linear-gradient(165deg, #0d0d0d 0%, #1a1a1a 40%, #262626 100%);
        }
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.8;
        }
        .overlay {
            position: relative;
            z-index: 1;
            color: #fff;
            padding: 50px;
            font-family: monospace;
            font-size: 16px;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <canvas id="matrix-bg"></canvas>
    <div class="overlay">
        <h1>🎬 Test Force Animations</h1>
        <div id="output"></div>
    </div>

    <script src="/js/animations.js?v=2200"></script>
    <script>
        const output = document.getElementById('output');
        let log = '';

        function addLog(msg, success = true) {
            log += `<div class="${success ? 'success' : 'error'}">${msg}</div>`;
            output.innerHTML = log;
        }

        // Test 1: Vérifications
        addLog('✓ Canvas: ' + !!document.getElementById('matrix-bg'));
        addLog('✓ initAnimation: ' + (typeof initAnimation === 'function'));
        addLog('✓ Theme: ' + document.documentElement.getAttribute('data-theme'));

        // Test 2: Force init MAINTENANT
        if (typeof initAnimation === 'function') {
            addLog('▶ Calling initAnimation()...');
            try {
                initAnimation();
                addLog('✓ initAnimation() executed without error');
            } catch (e) {
                addLog('✗ ERROR: ' + e.message, false);
            }

            // Test 3: Vérifier résultats après 1 seconde
            setTimeout(() => {
                const canvas = document.getElementById('matrix-bg');
                addLog('Canvas dimensions: ' + canvas.width + ' x ' + canvas.height);
                addLog('Canvas opacity: ' + canvas.style.opacity);
                
                const ctx = canvas.getContext('2d');
                addLog('Context: ' + (ctx ? 'OK' : 'NULL'));

                if (typeof AnimEngine !== 'undefined') {
                    addLog('AnimEngine intensity: ' + AnimEngine.getIntensity());
                    addLog('AnimEngine quality: ' + AnimEngine.getQuality());
                }

                addLog('');
                addLog('👁️ REGARDEZ L\'ÉCRAN - Voyez-vous des particules dorées ?');
                addLog('Si OUI → Le système fonctionne, problème = timing au login');
                addLog('Si NON → Le système ne dessine pas, problème dans le code');
            }, 1000);
        } else {
            addLog('✗ initAnimation NOT FOUND!', false);
        }
    </script>
</body>
</html>
