<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic ProductiveApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #d4af37;
            margin-bottom: 30px;
        }
        .section {
            background: #1a1a1a;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            border-left: 4px solid #d4af37;
        }
        .section h2 {
            color: #d4af37;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .test {
            padding: 10px;
            margin: 10px 0;
            background: #0a0a0a;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .test.pass { border-left: 3px solid #4ade80; }
        .test.fail { border-left: 3px solid #f87171; }
        .test.warn { border-left: 3px solid #fbbf24; }
        button {
            background: #d4af37;
            color: #0a0a0a;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 10px 10px 0;
        }
        button:hover {
            background: #f0c24d;
        }
        .actions {
            margin-top: 30px;
        }
        code {
            background: #2a2a2a;
            padding: 2px 6px;
            border-radius: 3px;
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Diagnostic ProductiveApp</h1>

        <div class="section">
            <h2>État des Fichiers</h2>
            <div id="files-status">Vérification en cours...</div>
        </div>

        <div class="section">
            <h2>État du Cache</h2>
            <div id="cache-status">Vérification en cours...</div>
        </div>

        <div class="section">
            <h2>Recommandations</h2>
            <div id="recommendations"></div>
        </div>

        <div class="section actions">
            <h2>Actions</h2>
            <button onclick="clearAllCache()">🗑️ Vider Tout le Cache</button>
            <button onclick="forceReload()">🔄 Recharger Sans Cache</button>
            <button onclick="goToApp()">🚀 Aller à l'App</button>
        </div>
    </div>

    <script>
        const TIMESTAMP = Date.now();

        async function checkFiles() {
            const filesStatus = document.getElementById('files-status');
            const files = [
                { name: 'style-overrides.css', url: `/css/style-overrides.css?v=9999&t=${TIMESTAMP}`, shouldContain: 'DISABLED 2026-02-13' },
                { name: 'index.html', url: `/?t=${TIMESTAMP}`, shouldContain: 'EMERGENCY SW KILLER' },
                { name: 'login.css', url: `/js/modules/auth/login.css?v=1700&t=${TIMESTAMP}`, shouldContain: 'auth-login-overlay' }
            ];

            let html = '';

            for (const file of files) {
                try {
                    const response = await fetch(file.url, { cache: 'no-store' });
                    const text = await response.text();
                    const hasContent = text.includes(file.shouldContain);

                    if (hasContent) {
                        html += `<div class="test pass">✅ ${file.name} : OK (contient "${file.shouldContain}")</div>`;
                    } else {
                        html += `<div class="test warn">⚠️ ${file.name} : Chargé mais contenu ancien</div>`;
                    }
                } catch (error) {
                    html += `<div class="test fail">❌ ${file.name} : Erreur - ${error.message}</div>`;
                }
            }

            filesStatus.innerHTML = html;
        }

        async function checkCache() {
            const cacheStatus = document.getElementById('cache-status');
            let html = '';

            // Service Workers
            if ('serviceWorker' in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                if (regs.length === 0) {
                    html += `<div class="test pass">✅ Aucun Service Worker</div>`;
                } else {
                    html += `<div class="test fail">❌ ${regs.length} Service Worker(s) actif(s)</div>`;
                    regs.forEach(reg => {
                        html += `<div class="test fail">  → ${reg.scope}</div>`;
                    });
                }
            }

            // Caches
            const cacheNames = await caches.keys();
            if (cacheNames.length === 0) {
                html += `<div class="test pass">✅ Aucun cache</div>`;
            } else {
                html += `<div class="test warn">⚠️ ${cacheNames.length} cache(s) trouvé(s)</div>`;
            }

            // LocalStorage
            const lsKeys = Object.keys(localStorage);
            html += `<div class="test ${lsKeys.length === 0 ? 'pass' : 'warn'}">📦 localStorage : ${lsKeys.length} clés</div>`;

            cacheStatus.innerHTML = html;
        }

        async function generateRecommendations() {
            const recommendations = document.getElementById('recommendations');
            let html = '';

            const regs = await navigator.serviceWorker.getRegistrations();
            const cacheNames = await caches.keys();

            if (regs.length > 0 || cacheNames.length > 0) {
                html += `<div class="test warn">⚠️ <strong>Cache détecté</strong> - Clique sur "Vider Tout le Cache" puis "Recharger Sans Cache"</div>`;
            }

            // Check Cloudflare
            html += `<div class="test warn">⚠️ <strong>Cache Cloudflare</strong> - Va sur Cloudflare Dashboard → giri-app.com → Caching → Purge Cache → Purge Everything</div>`;

            html += `<div class="test pass">✅ Après avoir vidé les caches, clique sur "Aller à l'App"</div>`;

            recommendations.innerHTML = html;
        }

        async function clearAllCache() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ Nettoyage...';

            try {
                // Service Workers
                const regs = await navigator.serviceWorker.getRegistrations();
                for (const reg of regs) {
                    await reg.unregister();
                }

                // Caches
                const cacheNames = await caches.keys();
                for (const name of cacheNames) {
                    await caches.delete(name);
                }

                // Storage
                localStorage.clear();
                sessionStorage.clear();

                btn.textContent = '✅ Nettoyé !';
                setTimeout(() => location.reload(), 1000);
            } catch (error) {
                btn.textContent = '❌ Erreur';
                alert('Erreur: ' + error.message);
                btn.disabled = false;
            }
        }

        function forceReload() {
            sessionStorage.setItem('force_reload', Date.now());
            window.location.href = `/?nocache=${Date.now()}`;
        }

        function goToApp() {
            window.location.href = `/`;
        }

        // Run diagnostics
        (async () => {
            await Promise.all([
                checkFiles(),
                checkCache(),
                generateRecommendations()
            ]);
        })();
    </script>
</body>
</html>
