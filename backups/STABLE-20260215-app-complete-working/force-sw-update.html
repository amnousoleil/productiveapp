<!DOCTYPE html>
<html>
<head>
    <title>Force SW Update</title>
</head>
<body>
    <h1>Désinstallation du Service Worker...</h1>
    <div id="status">En cours...</div>
    <script>
        async function unregisterAllSW() {
            const registrations = await navigator.serviceWorker.getRegistrations();
            console.log(`${registrations.length} Service Workers trouvés`);

            for (let registration of registrations) {
                await registration.unregister();
                console.log('SW désinstallé:', registration.scope);
            }

            // Clear all caches
            const cacheNames = await caches.keys();
            console.log(`${cacheNames.length} caches trouvés`);

            for (let cacheName of cacheNames) {
                await caches.delete(cacheName);
                console.log('Cache supprimé:', cacheName);
            }

            document.getElementById('status').innerHTML = `
                <h2 style="color: green;">✅ Nettoyage terminé!</h2>
                <p>${registrations.length} Service Worker(s) désinstallé(s)</p>
                <p>${cacheNames.length} cache(s) supprimé(s)</p>
                <p><strong>Maintenant, faites Ctrl+Shift+R puis retournez sur <a href="/">l'application</a></strong></p>
            `;
        }

        unregisterAllSW().catch(err => {
            document.getElementById('status').innerHTML = `<h2 style="color: red;">❌ Erreur: ${err.message}</h2>`;
        });
    </script>
</body>
</html>
