server {
    listen 8080;
    listen [::]:8080;

    server_name giri-app.com www.giri-app.com srv1053121.hstgr.cloud localhost;

    root /var/www/productiveapp;
    index index.html;

    # Logs
    access_log /var/log/nginx/productiveapp-access.log;
    error_log /var/log/nginx/productiveapp-error.log;

    # =============================================
    # PERFORMANCE: GZIP COMPRESSION (70-90% size reduction!)
    # =============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_min_length 1000;
    gzip_disable "msie6";

    # Security headers at server level
    include /etc/nginx/snippets/security-headers.conf;

    # =============================================
    # SECURITY: Block attack patterns
    # =============================================

    # Block hidden files (except .well-known for SSL)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Block sensitive file types
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|env)$ {
        deny all;
        return 404;
    }

    # Block sensitive directories
    location ~ ^/(\.git|\.claude|node_modules|database|docs|_modules)/ {
        deny all;
        return 404;
    }

    # =============================================
    # ROUTES
    # =============================================

    # Redirect dashboard to root
    location = /dashboard/ {
        return 301 /;
    }

    location /dashboard {
        return 301 /;
    }

    # Health check proxy
    location = /api/health {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=req_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Auth endpoints - RATE LIMITING DISABLED (2026-02-13)
    location /api/v1/auth/login {
        include /etc/nginx/snippets/security-headers.conf;
        # limit_req zone=login_limit burst=20 nodelay;
        # limit_conn conn_limit 5;
        proxy_pass http://127.0.0.1:3000/api/v1/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/register {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=login_limit burst=20 nodelay;
        limit_conn conn_limit 3;
        proxy_pass http://127.0.0.1:3000/api/v1/auth/register;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Proxy to backend - rate limited
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_hide_header X-Powered-By;
    }
    # WebSocket proxy - real-time notifications
    location /ws {
        proxy_pass http://127.0.0.1:3000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Uploads - served by backend
    # Uploads - served directly (logos, avatars, etc)
    location /uploads/ {
        alias /var/www/productiveapp/uploads/;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Only allow images
        location ~* \.(jpg|jpeg|png|gif|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Video recordings - served directly for better performance
    location /recordings/ {
        alias /var/www/productiveapp/recordings/;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;

        # Enable range requests for video seeking
        add_header Accept-Ranges bytes;

        # Video-specific cache settings
        expires 7d;
        add_header Cache-Control "private, max-age=604800";

        # MIME types for video
        types {
            video/webm webm;
            video/mp4 mp4;
            video/x-matroska mkv;
        }
    }

    # Galaxie View - Excalidraw SPA
    location /galaxie/ {
        alias /var/www/productiveapp/galaxy/;
        try_files $uri $uri/ /galaxy/index.html;

        location = /galaxie/index.html {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    location /galaxy/ {
        alias /var/www/productiveapp/galaxy/;
        try_files $uri $uri/ /galaxy/index.html;

        location = /galaxy/index.html {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # Messaging is handled by the integrated backend at /api/v1/messaging/
    # Standalone messaging app (ports 8088/5188) removed - not needed

    # Main app images
    location ^~ /assets/images/ {
        alias /var/www/productiveapp/assets/images/;
        try_files $uri =404;
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # Vendor libraries (jsPDF, Chart.js, Rough.js, etc.) - PHASE 0 self-hosted
    location ^~ /assets/vendor/ {
        alias /var/www/productiveapp/assets/vendor/;
        try_files $uri =404;
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # Galaxy/Excalidraw assets
    location ^~ /assets/ {
        alias /var/www/productiveapp/galaxy/assets/;
        try_files $uri =404;
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # Giri Vision - Custom meet URL
    location ~* ^/meet/([a-zA-Z0-9-]+)$ {
        try_files /meet.html /meet.html;
    }

    # SPA fallback
    location / {
        limit_req zone=req_limit burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Static files cache - Images/fonts: immutable (rarely change)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker: NEVER cache (must update immediately)
    location = /sw.js {
        expires -1;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # CSS/JS: cache agressif car cache busters ?v=XXX forcent le reload si modifié
    location ~* \.(js|css)$ {
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    # No-cache for index.html
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
