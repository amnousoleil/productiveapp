<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gyro-grad-urgent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <filter id="glow-urgent">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Base -->
  <rect x="10" y="24" width="12" height="6" rx="2" fill="#991B1B"/>
  <!-- Corps -->
  <path d="M 12 10 L 12 24 L 20 24 L 20 10 Q 20 6 16 6 Q 12 6 12 10 Z" fill="url(#gyro-grad-urgent)" filter="url(#glow-urgent)"/>
  <!-- Dôme lumineux -->
  <ellipse cx="16" cy="10" rx="6" ry="4" fill="#EF4444" opacity="0.8"/>
  <ellipse cx="16" cy="10" rx="4" ry="2.5" fill="#FCA5A5" opacity="0.9"/>
  <!-- Éclat central -->
  <circle cx="16" cy="10" r="2" fill="#FECACA"/>
  <!-- Rayons -->
  <path d="M 16 4 L 16 1 M 16 19 L 16 22 M 9 10 L 6 10 M 23 10 L 26 10 M 11 6 L 8 3 M 21 6 L 24 3 M 11 14 L 8 17 M 21 14 L 24 17"
        stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
</svg>
