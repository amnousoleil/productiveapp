<!DOCTYPE html>
<html lang="fr" data-theme="midnight">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes v6.0 - DÉMO WORLD CLASS</title>

    <!-- Base CSS -->
    <link rel="stylesheet" href="/css/style-base.css?v=5000">
    <link rel="stylesheet" href="/css/style-themes.css?v=1100">

    <!-- Notes v6.0 CSS -->
    <link rel="stylesheet" href="/css/notes-layout-v6.css?v=6000">
    <link rel="stylesheet" href="/css/notes-command-palette.css?v=6000">
    <link rel="stylesheet" href="/css/notes-components-v6.css?v=6000">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #e4e7ec;
        }

        #demo-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        #demo-header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: white;
        }

        #demo-header .badge {
            padding: 6px 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: white;
        }

        #demo-container {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .demo-note {
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .demo-note h2 {
            margin: 0 0 12px 0;
            font-size: 20px;
            color: #6366f1;
        }

        .demo-note p {
            margin: 0;
            line-height: 1.6;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <!-- Header DÉMO -->
    <div id="demo-header">
        <h1>🚀 Notes v6.0 - WORLD CLASS EDITION</h1>
        <div class="badge">DÉMO LIVE</div>
    </div>

    <!-- Container principal -->
    <div id="demo-container">
        <div id="view-notes"></div>
    </div>

    <!-- Config minimale -->
    <script>
        // Mock minimal pour démo
        window.AppConfig = {
            API_URL: 'http://localhost:3000/api/v1'
        };

        window.AppState = {
            currentUser: { id: 'demo-user', name: 'Demo User' }
        };

        // Mock ApiNotes
        window.ApiNotes = {
            getAll: async () => [
                {
                    id: 'note-1',
                    title: 'Bienvenue dans Notes v6.0',
                    content: 'Ceci est une **démo** du nouveau système Notes.\n\nVoir [[Getting Started]] pour commencer.\n\nTags: #demo #v6',
                    tags: ['demo', 'v6'],
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                },
                {
                    id: 'note-2',
                    title: 'Getting Started',
                    content: 'Appuyez sur **Ctrl+P** pour ouvrir la Command Palette.\n\nUtilisez [[Wiki Links]] pour lier vos notes.\n\nTags: #tutorial',
                    tags: ['tutorial'],
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                },
                {
                    id: 'note-3',
                    title: 'Wiki Links',
                    content: 'Les liens wiki permettent de créer des connexions entre vos notes.\n\nExemple: [[Note 1]] [[Note 2]]\n\nTags: #features #wiki',
                    tags: ['features', 'wiki'],
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                }
            ],
            create: async (data) => ({ id: 'note-new', ...data }),
            update: async (id, data) => ({ id, ...data }),
            delete: async (id) => ({ success: true })
        };

        // Mock Toast
        window.Toast = {
            success: (msg) => console.log('✅', msg),
            error: (msg) => console.log('❌', msg),
            info: (msg) => console.log('ℹ️', msg)
        };
    </script>

    <!-- Core Notes -->
    <script src="/js/modules/notes/notes-core.js"></script>
    <script src="/js/modules/notes/notes-render.js"></script>
    <script src="/js/modules/notes/notes-editor.js"></script>

    <!-- v6.0 World Class Modules -->
    <script src="/js/modules/notes/notes-wiki-links.js"></script>
    <script src="/js/modules/notes/notes-tags-view.js"></script>
    <script src="/js/modules/notes/notes-daily-view.js"></script>
    <script src="/js/modules/notes/notes-backlinks-panel.js"></script>
    <script src="/js/modules/notes/notes-ai-bridge.js"></script>
    <script src="/js/modules/notes/notes-command-palette.js"></script>
    <script src="/js/modules/notes/notes-layout-v6.js"></script>
    <script src="/js/modules/notes/notes-init.js"></script>

    <!-- Init démo -->
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            console.log('🎨 Initializing Notes v6.0 DEMO...');

            try {
                await NotesModule.init();
                NotesModule.render();

                console.log('✅ DÉMO prête ! Appuyez sur Ctrl+P pour Command Palette');
            } catch (error) {
                console.error('❌ Démo init failed:', error);
            }
        });
    </script>
</body>
</html>
